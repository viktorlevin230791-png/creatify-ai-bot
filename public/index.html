<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Creatify AI Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -200px, #6f5bff33, transparent),
        radial-gradient(800px 400px at 100% 0%, #4fa3ff22, transparent),
        #0b0c12;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.02)
      );
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c5cff, #4fa3ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 10px 30px rgba(124,92,255,0.4);
    }

    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
    }

    .subtitle {
      margin: 14px 0 22px;
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255,255,255,0.75);
    }

    .btn {
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 14px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-channel {
      background: rgba(255,255,255,0.08);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .btn-check {
      background: linear-gradient(135deg, #7c5cff, #4fa3ff);
      color: #fff;
      box-shadow: 0 12px 30px rgba(124,92,255,0.45);
    }

    .btn-tool {
      background: linear-gradient(135deg, #8b5cff, #5c7cff);
      color: #fff;
      box-shadow: 0 14px 40px rgba(124,92,255,0.55);
      font-size: 17px;
    }

    .status {
      margin-top: 18px;
      font-size: 15px;
      text-align: center;
    }

    .success {
      color: #6cffb2;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="logo">
        <div class="logo-icon">🎨</div>
        <h1>Creatify AI Studio</h1>
      </div>

      <div class="subtitle">
        Получи <b>бесплатный доступ</b> к AI-инструментам  
        после подписки на наш Telegram-канал
      </div>

      <a
        class="btn btn-channel"
        href="https://t.me/neyrolooms"
        target="_blank"
      >
        📢 Подписаться на канал
      </a>

      <button class="btn btn-check" onclick="checkSubscription()">
        ✅ Проверить подписку
      </button>

      <div id="status" class="status hidden"></div>

      <a
        id="toolBtn"
        class="btn btn-tool hidden"
        href="https://lmarena.ai/ru/c/019bee6b-3942-77d2-86fd-10c03d281086"
        target="_blank"
      >
        🚀 Запустить AI-генератор
      </a>

      <div class="footer">
        © Creatify AI · Telegram @neyrolooms
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function checkSubscription() {
      const statusEl = document.getElementById("status");
      const toolBtn = document.getElementById("toolBtn");

      statusEl.classList.remove("hidden");
      statusEl.textContent = "⏳ Проверяем подписку...";

      setTimeout(() => {
        statusEl.innerHTML =
          "🎉 <b>Подписка подтверждена</b><br>🔓 Доступ открыт";
        statusEl.classList.add("success");
        toolBtn.classList.remove("hidden");
      }, 700);
    }
  </script>
</body>
</html>
